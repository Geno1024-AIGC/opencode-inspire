name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read build number
        id: buildnum
        run: echo "build=$(git show HEAD:build_count.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish canary release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          BUILD="${{ steps.buildnum.outputs.build }}"
          TAG="0.1.${{ github.run_number }}.$BUILD.$SHORT_SHA"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          # Delete any previous canary prereleases so only the latest remains
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == true) | .tagName' \
            | while IFS= read -r old_tag; do
                if [ -n "$old_tag" ] && [ "$old_tag" != "$TAG" ]; then
                  gh release delete "$old_tag" --yes --cleanup-tag
                fi
              done
          # Publish the new canary as a prerelease (visible to the app without auth)
          gh release create "$TAG" "$APK" \
            --repo "Geno1024-AIGC/opencode-inspire" \
            --title "Canary $TAG" \
            --notes "Auto-built canary from master." \
            --prerelease
