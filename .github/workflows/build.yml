name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The version stamp uses `git rev-list --count HEAD` for `env`; a
          # shallow checkout would report 1 and every canary would look older
          # than a locally built APK to the in-app updater.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        env:
          BUILD_COUNT_TOKEN: ${{ secrets.BUILD_COUNT_TOKEN }}
          BUILD_COUNT_URL: ${{ vars.BUILD_COUNT_URL || secrets.BUILD_COUNT_URL }}
        run: |
          set -euo pipefail
          if [ -n "${BUILD_COUNT_TOKEN:-}" ] && [ -n "${BUILD_COUNT_URL:-}" ]; then
            ./gradlew :app:assembleDebug --no-daemon
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::BUILD_COUNT_TOKEN/URL unavailable for this pull request; building without bumping pack."
            ./gradlew :app:assembleDebug -Ppack.bump=false -Ppack.value=0 --no-daemon
          else
            echo "::error::BUILD_COUNT_TOKEN and BUILD_COUNT_URL must be available; packaging builds must be counted."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish canary release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Publish the APK's own stamp. The updater compares the `env` segment
          # with the installed versionName, so a CI run number would make every
          # canary look older than any local build and never be offered.
          TAG=$(jq -r '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          APK="app/build/outputs/apk/debug/app-debug.apk"
          # Delete any previous canary prereleases so only the latest remains
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == true) | .tagName' \
            | while IFS= read -r old_tag; do
                if [ -n "$old_tag" ] && [ "$old_tag" != "$TAG" ]; then
                  gh release delete "$old_tag" --yes --cleanup-tag
                fi
              done
          # Publish the new canary as a prerelease (visible to the app without auth)
          gh release create "$TAG" "$APK" \
            --repo "Geno1024-AIGC/opencode-inspire" \
            --title "Canary $TAG" \
            --notes "Auto-built canary from master." \
            --prerelease
